# Corridor config for the network builder (any subset of BuilderConfig fields).
# Build with:
#   uv run python applications/network_builder/network_builder_demo.py \
#       --config applications/network_builder/corridors/winnipeg_chicago.yaml \
#       --download --with-elevation
output_name: winnipeg_chicago
origin_regions: [MRO, mb, mb]
destination_regions: [RFC, IL, IL]
regions:
  - name: manitoba
    url: https://download.geofabrik.de/north-america/canada/manitoba-latest.osm.pbf
  - name: north-dakota
    url: https://download.geofabrik.de/north-america/us/north-dakota-latest.osm.pbf
  - name: minnesota
    url: https://download.geofabrik.de/north-america/us/minnesota-latest.osm.pbf
  - name: wisconsin
    url: https://download.geofabrik.de/north-america/us/wisconsin-latest.osm.pbf
  - name: illinois
    url: https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf
# CP / Soo Line routing: Winnipeg -> Emerson border -> Thief River Falls ->
# Detroit Lakes -> St. Cloud -> Twin Cities -> river route -> Milwaukee -> Chicago.
waypoints:
  - [Winnipeg, 49.899, -97.139]
  - [Emerson (Border), 49.000, -97.212]
  - [Thief River Falls, 48.115, -96.176]
  - [Detroit Lakes, 46.817, -95.845]
  - [St. Cloud, 45.561, -94.163]
  - [Minneapolis, 44.978, -93.273]
  - [St. Paul, 44.947, -93.086]
  - [Winona, 44.050, -91.640]
  - [La Crosse, 43.801, -91.240]
  - [Milwaukee, 43.035, -87.905]
  - [Chicago, 41.879, -87.638]
