simulation:
  length: 168                 # total simulation time (hours): default 7 days (168 hours)
  analyze_start: 72           # observation start time (hours): default from day 3 (hour 72)
  analyze_end: 120            # observation end time (hours): default to day 5 (hour 120)
  train_number: 1            # number of trains in the simulation
  train_batch_size: 100       # assume full_cars = oc_number = truck_number

yard:
  yard_type: parallel
  track_number: 5             # tracks to process containers
  receiving_track_numbers: 10 # tracks to hold decoupled railcars
  railcar_length: 60          # railcar length (joint + railcar; ft)
  d_f: 15                     # crossing offset (ft)
  d_x: 15                     # track spacing (ft)

terminal:
  cranes_per_track: 4           # int (broadcast to every track) or list of ints (one entry per track)
  hostler_number: 36            # all hostlers are shared between tracks
  hostler_diesel_percentage: 1  # percentage of diesel hostlers (decimal between 0 to 1)

gates:
  in_gate_numbers: 3        # truck entrance gate
  out_gate_numbers: 3       # truck exit gate

# Vessel side. Referenced by the ``rail_vessel`` and
# ``vessel_truck`` modes via ResourceSpec entries in ``lifts/specs.py``.
vessel:
  berth_number: 2                 # number of berths at the water-side terminal
  sts_cranes_per_berth: 2         # ship-to-shore cranes per berth

# Container-stack / yard equipment. Referenced by all three modes via
# ResourceSpec entries in ``lifts/specs.py``.
yard_stack:
  main_stack_rtg_count: 6         # rubber-tyred gantry cranes serving the stack
  top_pick_count: 2               # top-pick alternates to the main-stack RTG
  stack_capacity: 500             # max containers in flight through the stack
  parking_chassis_slot_count: 50  # yard-tractor staging slots at the stack
  main_yard_tractor_count: 12     # water<->stack tractor pool
  rail_yard_tractor_count: 8      # rail<->stack tractor pool
  terminal_chassis_count: 50      # chassis owned by the terminal (yard-tractor hauled)
  road_chassis_pool_count: 30     # claimable on-terminal road chassis for drayage
  road_chassis_claim_fraction: 0.5  # P(drayage truck claims a road chassis vs. brings own)
  routing_strategy: availability  # availability | rtg_only | top_pick_only

layout:
  file_path: "input/layout.xlsx"   # yard geometry file
  mode: adaptive                   # 'fixed' or 'adaptive'

  # Note: if mode == 'fixed' (i.e. simulation for a specific yard), use default parameters below
  M: 5         # rows of parking blocks
  N: 5         # cols of parking blocks
  n_t: 2       # train aisles per group
  n_p: 2       # parking aisles per group
  n_r: 20      # pairs of parking slots

# Per-event energy use rates (ZANZEFF reports, 2022).
# Diesel/Hybrid values are in gallons; Electric values are in kWh.
#
# ``load_consumption`` is per-lift; ``trip_consumption`` is per-hour of
# travel. Each block keys on ``<equipment>_<status>``. The generic
# ``crane_*`` / ``hostler_*`` / ``truck_*`` entries remain as fallbacks
# for any code path that passes generic vehicle keys; the flow modules
# pass equipment-specific keys (``main_stack_rtg_loaded``,
# ``sts_loaded``, ``yard_tractor_loaded``, etc.).
energy_use:
  load_consumption:
    # --- generic crane (kept for fallback) ---
    crane_loaded:
      Diesel: 0.26    # kWh per load
      Hybrid: 0.48
    crane_idle:
      Diesel: 0.02
      Hybrid: 0.024

    # --- per-equipment lift rates ---
    rail_track_rtg_loaded:        # RTG that exchanges with a parked train
      Diesel: 0.26
      Hybrid: 0.48
      Electric: 4.50
    rail_track_rtg_idle:
      Diesel: 0.02
      Hybrid: 0.024
      Electric: 0.20

    main_stack_rtg_loaded:        # RTG serving the container stack
      Diesel: 0.30
      Hybrid: 0.45
      Electric: 4.80
    main_stack_rtg_idle:
      Diesel: 0.02
      Hybrid: 0.024
      Electric: 0.20

    top_pick_loaded:              # top-pick alternative for the main stack
      Diesel: 0.50
      Electric: 5.20
    top_pick_idle:
      Diesel: 0.03
      Electric: 0.25

    sts_crane_loaded:             # ship-to-shore crane
      Diesel: 0.40    # rarely diesel in practice; included for parity
      Electric: 7.00
    sts_crane_idle:
      Diesel: 0.04
      Electric: 0.40

  trip_consumption:
    # --- generic hostler / truck (kept for fallback) ---
    hostler_empty:
      Diesel: 1.11    # gallons/hr or kWh/hr
      Electric: 2.78
    hostler_loaded:
      Diesel: 1.94
      Electric: 3.66
    truck_empty:
      Diesel: 1.11
      Electric: 2.68
    truck_loaded:
      Diesel: 1.94
      Electric: 3.66

    # --- per-pool yard tractor rates ---
    yard_tractor_empty:
      Diesel: 1.11
      Electric: 2.78
    yard_tractor_loaded:
      Diesel: 1.94
      Electric: 3.66

  side_pick_consumption:
    side:
      Diesel: 2.88    # per lift
      Electric: 0.21