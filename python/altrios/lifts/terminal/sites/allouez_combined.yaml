# Allouez combined-mode demo site.
#
# Activates BOTH ``truck_rail`` and ``vessel_truck`` simultaneously
# against shared resource pools (one yard-crane fleet, one container
# stack, one chassis pool, one yard-tractor fleet). Demonstrates the
# multi-mode dispatch unblock: ``train`` arrivals route to truck_rail,
# ``vessel`` arrivals route to vessel_truck, and ``drayage`` arrivals
# are explicitly tagged by their schedule builder so the dispatcher
# can pick the right mode for each.
#
# Why this combination:
# - truck_rail's drayage builds from the train consist plan (one
#   dropoff per outbound container before each train, one pickup per
#   inbound container after each train).
# - vessel_truck's drayage builds from the canonical CSV
#   (vessel<->truck flows have no train consist plan to synthesize
#   from).
# - The two drayage streams are conceptually distinct (different
#   trucks moving different containers) so contending on the same
#   ``drayage`` kind would be a modeling error -- the ``mode`` key
#   on each arrival dict makes the partition explicit.
#
# rail_vessel mode is NOT activated here because its single-mode
# version covers the train<->vessel exchange and there is no clean
# story for how a combined site should split trains between truck_rail
# and rail_vessel without explicit per-train routing data. A future
# combined site that wants rail_vessel can use
# ``rail_vessel_train_arrivals`` from the catalog (which stamps
# ``mode: rail_vessel`` on its output) and disable truck_rail's
# train_arrivals or rely on per-train routing.
meta:
  schema_version: 1
name: allouez_combined
catalog: altrios.lifts.terminal
modes: [truck_rail, vessel_truck]

config: !include ../resources/config.yaml

schedules:
  # ``train`` is uncontended (only truck_rail routes it) -> no mode
  # tag needed.
  train_arrivals: null
  # ``vessel`` is uncontended (only vessel_truck routes it) -> no
  # mode tag needed.
  vessel_arrivals: null
  # ``drayage`` is contended (both modes route it). The two builders
  # stamp explicit ``mode: truck_rail`` / ``mode: vessel_truck`` so
  # the dispatcher routes each arrival to the correct workflow.
  truck_rail_drayage_arrivals: null
  vessel_truck_drayage_arrivals: null

seed: 42
