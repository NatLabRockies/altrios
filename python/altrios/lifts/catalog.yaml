# ---------------------------------------------------------------------------
# Freight intermodal catalog (Phase 3 / Strategy B).
#
# Three modes: truck_rail, rail_vessel, vessel_truck. Each mode's graph
# consists of a single ``python:`` step that delegates to the existing
# freight generators in altrios.lifts.{train_flow,drayage_flow,vessel_flow}
# via thin wrappers in altrios.lifts.python_helpers.
#
# Resource pools are NOT declared here. The freight ResourceSpec
# instances in altrios.lifts.specs use Python lambdas for capacity /
# partition_by / init_items, which the YAML resource-spec form doesn't
# accept directly. Instead, the catalog's state_init callable
# (``freight.build_freight_state``) instantiates the spec union at run
# start and attaches every primitive to state. **Phase A.6 translates
# these specs into YAML form and moves them under each mode's
# ``resources:`` block.**
#
# config_defaults ships only the eight numeric simulation constants
# that previously lived as class-level attributes on
# ``altrios.lifts.classes.Terminal``. Every site is expected to
# ``!include resources/config.yaml`` to populate the rest of the
# config surface (yard, terminal, gates, vessel, yard_stack, energy_use,
# layout).
# ---------------------------------------------------------------------------
meta:
  schema_version: 1
name: freight_intermodal
description: >-
  Intermodal terminal catalog covering truck<->rail, rail<->vessel,
  and vessel<->truck container flows. Phase 3 Strategy B: graphs are
  thin shims over the existing Python freight flow modules.
python_module: altrios.lifts.python_helpers

config_defaults:
  # Constants previously hard-coded on Terminal.__init__. The freight
  # generators read these off `terminal.containers_per_crane_move_mean`
  # etc.; the TerminalAdapter exposes them by mirroring this block.
  containers_per_crane_move_mean: 0.03333    # 2 min / 60 min/hr
  crane_move_dev_time: 0.000278              # 1 sec / 3600 sec/hr
  truck_diesel_percentage: 1.0
  truck_arrival_mean: 0.03333
  truck_ingate_time: 0.03333
  truck_ingate_time_dev: 0.03333
  truck_outgate_time: 0.03333
  truck_outgate_time_dev: 0.03333

entity_kinds:
  - name: train
    attrs:
      arrival_time: float
      train_id: int
      full_cars: int
      oc_number: int
  - name: drayage
    attrs:
      arrival_time: float
      truck_id: int
      action: str
  - name: vessel
    attrs:
      arrival_time: float
      vessel_id: int

modes:
  # ---- truck_rail ----
  - name: truck_rail
    arrival_routing:
      train: handle_train_arrival
      drayage: handle_drayage_arrival
    graphs:
      # Phase A.4: top-level train-arrival orchestration in YAML.
      # The IC/OC inner body remains a python: escape hatch because
      # it composes the yard_flow helpers (stack_in/stack_out/
      # yard_tractor_haul), each a SimPy generator in its own right.
      - name: handle_train_arrival
        entry: setup
        steps:
          - id: setup
            type: python
            params:
              call: freight.setup_train_arrival
              args:
                env: "{env}"
                entity: "{entity}"
              bind: meta
            next: pre_record_expected
          - id: pre_record_expected
            type: python
            params:
              call: freight.record_train_arrival_expected
              args:
                env: "{env}"
                state: "{state}"
                meta: "{bindings.meta}"
            next: wait_for_arrival
          - id: wait_for_arrival
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.arrival_time - env.now)}"
            next: acquire_track
          - id: acquire_track
            type: request
            params:
              pool: tracks
              bind: track_id
            next: log_arrival
          - id: log_arrival
            type: python
            params:
              call: freight.log_train_on_track
              args:
                env: "{env}"
                meta: "{bindings.meta}"
                track_id: "{bindings.track_id}"
            next: unload_loop
          - id: unload_loop
            type: loop
            params:
              over: "{bindings.meta.ic_ids}"
              as: ic_id
              do: unload_one_ic_call
              parallel: true
            next: load_loop
          - id: unload_one_ic_call
            type: python
            params:
              call: freight.unload_one_ic
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                track_id: "{bindings.track_id}"
                train_id: "{bindings.meta.train_id}"
                ic_id: "{bindings.ic_id}"
          - id: load_loop
            type: loop
            params:
              over: "{bindings.meta.oc_ids}"
              as: oc_idx
              do: load_one_oc_call
              parallel: true
            next: wait_for_depart
          - id: load_one_oc_call
            type: python
            params:
              call: freight.load_one_oc
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                track_id: "{bindings.track_id}"
                train_id: "{bindings.meta.train_id}"
          - id: wait_for_depart
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.departure_time - env.now)}"
            next: record_depart
          - id: record_depart
            type: python
            params:
              call: freight.record_train_depart_events
              args:
                env: "{env}"
                state: "{state}"
                train_id: "{bindings.meta.train_id}"
            next: release_track
          - id: release_track
            type: release
            params:
              pool: tracks
              bind: track_id
      # Phase A.5: lift wait + dropoff/pickup branch into YAML.
      # The dropoff and pickup bodies remain python: escape hatches
      # (they compose yard_flow stack ops + the legacy gate helpers).
      - name: handle_drayage_arrival
        entry: setup
        steps:
          - id: setup
            type: python
            params:
              call: freight.setup_drayage_arrival
              args:
                env: "{env}"
                entity: "{entity}"
                config: "{config}"
              bind: meta
            next: wait_for_arrival
          - id: wait_for_arrival
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.arrival_time - env.now)}"
            next: dispatch_action
          - id: dispatch_action
            type: branch
            params:
              condition: "{bindings.meta.action == 'dropoff'}"
              "true": do_dropoff
              "false": do_pickup
          - id: do_dropoff
            type: python
            params:
              call: freight.drayage_dropoff
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"
          - id: do_pickup
            type: python
            params:
              call: freight.drayage_pickup
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"

  # ---- rail_vessel ----
  - name: rail_vessel
    arrival_routing:
      train: handle_train_arrival
      vessel: handle_vessel_arrival
    graphs:
      - name: handle_train_arrival
        # Same 12-step decomposition used by truck_rail; both modes
        # share the rail-side state surface (tracks, rail_track_rtgs_by_track,
        # main_stack_rtgs, etc.).
        entry: setup
        steps:
          - id: setup
            type: python
            params:
              call: freight.setup_train_arrival
              args:
                env: "{env}"
                entity: "{entity}"
              bind: meta
            next: pre_record_expected
          - id: pre_record_expected
            type: python
            params:
              call: freight.record_train_arrival_expected
              args:
                env: "{env}"
                state: "{state}"
                meta: "{bindings.meta}"
            next: wait_for_arrival
          - id: wait_for_arrival
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.arrival_time - env.now)}"
            next: acquire_track
          - id: acquire_track
            type: request
            params:
              pool: tracks
              bind: track_id
            next: log_arrival
          - id: log_arrival
            type: python
            params:
              call: freight.log_train_on_track
              args:
                env: "{env}"
                meta: "{bindings.meta}"
                track_id: "{bindings.track_id}"
            next: unload_loop
          - id: unload_loop
            type: loop
            params:
              over: "{bindings.meta.ic_ids}"
              as: ic_id
              do: unload_one_ic_call
              parallel: true
            next: load_loop
          - id: unload_one_ic_call
            type: python
            params:
              call: freight.unload_one_ic
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                track_id: "{bindings.track_id}"
                train_id: "{bindings.meta.train_id}"
                ic_id: "{bindings.ic_id}"
          - id: load_loop
            type: loop
            params:
              over: "{bindings.meta.oc_ids}"
              as: oc_idx
              do: load_one_oc_call
              parallel: true
            next: wait_for_depart
          - id: load_one_oc_call
            type: python
            params:
              call: freight.load_one_oc
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                track_id: "{bindings.track_id}"
                train_id: "{bindings.meta.train_id}"
          - id: wait_for_depart
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.departure_time - env.now)}"
            next: record_depart
          - id: record_depart
            type: python
            params:
              call: freight.record_train_depart_events
              args:
                env: "{env}"
                state: "{state}"
                train_id: "{bindings.meta.train_id}"
            next: release_track
          - id: release_track
            type: release
            params:
              pool: tracks
              bind: track_id
      # Phase A.6: vessel arrival decomposition. Workers (unload/load)
      # are wrapped in single python helpers because they internally
      # spawn N STS-crane processes + AllOf-join, which is awkward to
      # express as a YAML parallel loop. Everything around the workers
      # (setup -> wait -> berth acquire -> depart -> release) is YAML.
      - name: handle_vessel_arrival
        entry: setup
        steps:
          - id: setup
            type: python
            params:
              call: freight.setup_vessel_arrival
              args:
                env: "{env}"
                entity: "{entity}"
              bind: meta
            next: pre_record_expected
          - id: pre_record_expected
            type: python
            params:
              call: freight.vessel_pre_record_expected
              args:
                env: "{env}"
                state: "{state}"
                meta: "{bindings.meta}"
            next: wait_for_arrival
          - id: wait_for_arrival
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.arrival_time - env.now)}"
            next: acquire_berth
          - id: acquire_berth
            type: request
            params:
              pool: berths
              bind: berth_req
            next: prepare_berth_ctx
          - id: prepare_berth_ctx
            type: python
            params:
              call: freight.prepare_vessel_berth_ctx
              args:
                env: "{env}"
                state: "{state}"
                meta: "{bindings.meta}"
              bind: berth_ctx
            next: drain_unload
          - id: drain_unload
            type: python
            params:
              call: freight.vessel_drain_unload
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"
                berth_ctx: "{bindings.berth_ctx}"
            next: drain_load
          - id: drain_load
            type: python
            params:
              call: freight.vessel_drain_load
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"
                berth_ctx: "{bindings.berth_ctx}"
            next: wait_for_depart
          - id: wait_for_depart
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.departure_time - env.now)}"
            next: record_depart
          - id: record_depart
            type: python
            params:
              call: freight.record_vessel_depart
              args:
                env: "{env}"
                state: "{state}"
                vessel_id: "{bindings.meta.vessel_id}"
            next: release_berth
          - id: release_berth
            type: release
            params:
              pool: berths
              bind: berth_req

  # ---- vessel_truck ----
  - name: vessel_truck
    arrival_routing:
      vessel: handle_vessel_arrival
      drayage: handle_drayage_arrival
    graphs:
      - name: handle_vessel_arrival
        entry: setup
        steps:
          - id: setup
            type: python
            params:
              call: freight.setup_vessel_arrival
              args:
                env: "{env}"
                entity: "{entity}"
              bind: meta
            next: pre_record_expected
          - id: pre_record_expected
            type: python
            params:
              call: freight.vessel_pre_record_expected
              args:
                env: "{env}"
                state: "{state}"
                meta: "{bindings.meta}"
            next: wait_for_arrival
          - id: wait_for_arrival
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.arrival_time - env.now)}"
            next: acquire_berth
          - id: acquire_berth
            type: request
            params:
              pool: berths
              bind: berth_req
            next: prepare_berth_ctx
          - id: prepare_berth_ctx
            type: python
            params:
              call: freight.prepare_vessel_berth_ctx
              args:
                env: "{env}"
                state: "{state}"
                meta: "{bindings.meta}"
              bind: berth_ctx
            next: drain_unload
          - id: drain_unload
            type: python
            params:
              call: freight.vessel_drain_unload
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"
                berth_ctx: "{bindings.berth_ctx}"
            next: drain_load
          - id: drain_load
            type: python
            params:
              call: freight.vessel_drain_load
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"
                berth_ctx: "{bindings.berth_ctx}"
            next: wait_for_depart
          - id: wait_for_depart
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.departure_time - env.now)}"
            next: record_depart
          - id: record_depart
            type: python
            params:
              call: freight.record_vessel_depart
              args:
                env: "{env}"
                state: "{state}"
                vessel_id: "{bindings.meta.vessel_id}"
            next: release_berth
          - id: release_berth
            type: release
            params:
              pool: berths
              bind: berth_req
      - name: handle_drayage_arrival
        entry: setup
        steps:
          - id: setup
            type: python
            params:
              call: freight.setup_drayage_arrival
              args:
                env: "{env}"
                entity: "{entity}"
                config: "{config}"
              bind: meta
            next: wait_for_arrival
          - id: wait_for_arrival
            type: timeout
            params:
              duration: "{max(0.0, bindings.meta.arrival_time - env.now)}"
            next: dispatch_action
          - id: dispatch_action
            type: branch
            params:
              condition: "{bindings.meta.action == 'dropoff'}"
              "true": do_dropoff
              "false": do_pickup
          - id: do_dropoff
            type: python
            params:
              call: freight.drayage_dropoff
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"
          - id: do_pickup
            type: python
            params:
              call: freight.drayage_pickup
              args:
                env: "{env}"
                state: "{state}"
                config: "{config}"
                meta: "{bindings.meta}"

schedule_mappings:
  # Engine state_init hook. Runs after build_state_from_specs (which
  # produces an empty state for freight since no resources are declared
  # above) and is responsible for: (1) clearing the module-level
  # consumption_records buffer, (2) attaching container_events: [] to
  # state, (3) instantiating the freight ResourceSpec union and
  # attaching each pool to state, (4) building and attaching the
  # TerminalAdapter.
  state_init: freight.build_freight_state

  # Per-stream schedule builders. The site's ``schedules:`` block
  # keys reference these names; values are passed as ``schedule=`` to
  # the builder. Builders return list[dict] with kind / id /
  # arrival_time / per-entry attrs.
  train_arrivals:
    builder: freight.build_train_schedule
    terminal_name: Allouez
  truck_rail_drayage_arrivals:
    builder: freight.build_drayage_schedule_synth
    terminal_name: Allouez
  vessel_truck_drayage_arrivals:
    builder: freight.build_drayage_schedule_csv
    terminal_name: Allouez
  vessel_arrivals:
    builder: freight.build_vessel_schedule
    terminal_name: Allouez
