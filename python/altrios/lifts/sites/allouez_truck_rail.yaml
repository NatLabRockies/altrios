# Allouez truck<->rail demo site.
#
# Activates the truck_rail mode only. Schedules:
# - train_arrivals: loaded from the canonical resources/train_consist_plan.csv
#   (the path is the schedule value; the catalog's freight.build_train_schedule
#   builder resolves it).
# - drayage_arrivals: synthesized by the builder when schedule is null
#   (one dropoff per OC just before each train, one pickup per IC just
#   after; see ``freight.build_drayage_schedule_synth``).
#
# Site config pulls in the full freight config (yard/terminal/gates/vessel/
# yard_stack/energy_use/layout) via !include. The catalog ships the eight
# numeric freight constants (containers_per_crane_move_mean et al.) in
# its config_defaults so they don't need to be repeated here.
meta:
  schema_version: 1
name: allouez_truck_rail
catalog: altrios.lifts
modes: [truck_rail]

# !include resolves at YAML-load time. The path is relative to THIS
# file's directory so the included keys appear merged into site.config.
config: !include ../resources/config.yaml

schedules:
  train_arrivals: null                  # builder falls back to canonical CSV
  truck_rail_drayage_arrivals: null     # builder synthesizes from train schedule

seed: 42
