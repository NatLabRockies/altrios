[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "altrios"
version = "1.1.0"
authors = [
    { name = "ALTRIOS Team", email = "altrios@nlr.gov" },
    { name = "Chad Baker, Lead Developer" },
    { name = "Nick Reinicke, Developer" },
    { name = "Matt Bruchon, Developer" },
    { name = "Saad Akhtar, Developer" },
    { name = "Steven Shi, Developer" },
    { name = "Jinghu Hu, Developer" },
    { name = "Grant Payne, Developer" },
    { name = "Jason Lustbader, PI" },
    { name = "Garrett Anderson, Developer" },
    { name = "Joel Allardyce, Developer" },
    { name = "Prativa Hartnett, Developer" },
    { name = "Steve Fritz, SwRI Lead" },
    { name = "Tyler Dick, Co-PI" },
]
description = "Tool for modeling and optimization of advanced locomotive powertrains for freight rail decarbonization."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pandas>=2,<3",
    "numpy>=2.1",
    "numba>=0.59",
    "pymoo==0.6",
    "openpyxl",
    "xlrd",
    "seaborn",
    "matplotlib~=3.3",
    "plotly~=6.0",
    "typing_extensions",
    "pyarrow >= 16.0",
    # The library uses only APIs common to polars 1.x and 2.x; the resolver picks
    # the newest the interpreter supports (2.x needs Python 3.11 or newer).
    "polars>=1.44.2,<3",
    "PyYAML==6.0.2",
    "simpy",
    "progressbar2",
    "msgpack>=1.1.0",
    "ipykernel~=6.29",
    "executing~=2.0",
    "pip",
    "pyomo>=6.9",
    "highspy>=1.11",
    "scipy>=1.11",
]

[project.urls]
homepage = "https://www.nlr.gov/transportation/altrios"
source = "https://github.com/NatLabRockies/altrios"

[project.optional-dependencies]
# Deps for applications/network_builder (OSM -> ALTRIOS network pipeline)
networkbuilder = [
    "shapely>=2.0",
    "networkx>=3.0",
    "requests",
]
# Deps for publication-quality projected maps of electrified corridors (used by the
# corridor applications). Cartopy provides a proper projected CRS (e.g. Lambert
# Conformal Conic) so long corridors are not distorted like Web Mercator, plus
# Natural Earth basemap features.
mapping = [
    "cartopy>=0.24",
    "geopandas>=1.0",
    "pyproj>=3.6",
]
dev = [
    "pytest~=8.3",
    "maturin~=1.8",
    "python-lsp-server~=1.10",
    "ruff~=0.9",
    "pylsp-mypy~=0.7.0",
    "memory_profiler~=0.61.0",
    "mypy>=1.15.0",
    # Network builder workflow deps
    "altrios[networkbuilder]",
    # Projected mapping workflow deps
    "altrios[mapping]",
]
[dependency-groups]
dev = [
    "altrios[dev]",
]

[tool.maturin]
profile = "release"
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "altrios.altrios_pyo3"
manifest-path = "altrios-py/Cargo.toml"
include = [
    { format = "sdist", path = "altrios-core/Cargo.toml" },
    { format = "sdist", path = "altrios-core/src/*" },
    { format = "sdist", path = "altrios-py/Cargo.toml" },
    { format = "sdist", path = "altrios-py/src/*" },
    { format = "sdist", path = "altrios-core/altrios-proc-macros/Cargo.toml" },
    { format = "sdist", path = "altrios-core/altrios-proc-macros/src/*" },
]

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
altrios = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
cargo_test = "cargo test"
py_test = "maturin develop --release && pixi run -e dev pytest -v"
build_and_test = { depends-on = ["cargo_test", "py_test"] }

fmt = "ruff"
lint = "pylint"
style = { depends-on = ["fmt", "lint"] }

[tool.ruff]
line-length = 88

[tool.ruff.lint.pydocstyle]
# Python docstrings follow the Google style; see docs/src/developers.md.
convention = "google"
